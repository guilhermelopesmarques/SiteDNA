<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Site</title>
</head>

<body>
    <main>
        <section id="pagina-home">
            <header>
                <img src="imagens/logo.png" class="logo" alt="logo">
                <nav class="menu-principal">
                    <ul>
                        <li><a href="#">home</a></li>
                        <li><a href="#pagina-servicos">pré-vendas</a></li>
                        <li><a href="#pagina-cadastros">cadastro</a></li>
                    </ul>
                </nav>
            </header>
            <main>
                <h1>Aventura E Liberdade</h1>
                <div>
                    <a href="#" class="btn">Assista Ao Vídeo</a>
                    <a href="#" class="btn">Leia Mais</a>
                </div>
            </main>
        </section>
    </main>

    <section id="pagina-servicos">
        <div class="container my-5">
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div class="col">
                    <div class="card">
                        <img src="imagens/fundo2.jpg" class="card-img-top" alt="fundo">
                        <div class="card-body text-center">
                            <h5 class="card-title">Viagens</h5>
                            <a href="#" class="btn btn-primary m-3">Saiba Mais</a>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card">
                        <img src="imagens/fundo2.jpg" class="card-img-top" alt="fundo">
                        <div class="card-body text-center">
                            <h5 class="card-title">Turismo</h5>
                            <a href="#" class="btn btn-primary m-3">Saiba Mais</a>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card">
                        <img src="imagens/fundo2.jpg" class="card-img-top" alt="fundo">
                        <div class="card-body text-center">
                            <h5 class="card-title">Trilhas</h5>
                            <a href="#" class="btn btn-primary m-3">Saiba Mais</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="pagina-cadastros">
        <div class="card mx-auto col-11 col-md-8 col-lg-6">
            <img src="imagens/fundo2.jpg" class="card-img-top" alt="fundo">
            <div class="card-body">
                <div class="col-12 mb-3">
                    <label for="nome" class="form-label">Nome Completo
                    </label>
                    <input type="email" class="form-control" id="nome" placeholder="Nome Completo">
                </div>
                <div class="col-12 mb-3">
                    <label for="telefone" class="form-label">Telefone
                    </label>
                    <input type="email" class="form-control" id="telefone" placeholder="Telefone">
                </div>
                <div class="col-12 mb-3">
                    <label for="email" class="form-label">Email address
                    </label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                </div>
                <div class="col-12 mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Descreva Os Pacotes Que Vc Gostaria De
                        Obter Informações</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>
                <div class="row">
                    <div class="col-12 text-center"><a href="#" class="btn btn-primary">Enviar</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</body>

</html>
